[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-security-scanner"
version = "5.2.0"
description = "Advanced Web Security Scanner with AsyncIO and Plugin System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Luis", email = "luis@example.com"},
]
dependencies = [
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.11.0",
    "colorama>=0.4.0",
    "pyyaml>=6.0",
    "dnspython>=2.3.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
experiments = [
    "rich>=13.0",
]
# Agentic AI subsystem (ai_module/). Heavy, GPU-oriented; install explicitly:
#   uv pip install -e ".[ai]"
# Tuned for a single NVIDIA RTX 5090 (Blackwell / sm_120). As of early 2026 the
# Blackwell wheels need CUDA 12.8+; install a matching torch build first, e.g.
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu128
ai = [
    "torch>=2.6.0",
    "transformers>=4.48.0",
    "datasets>=2.19.0",
    "accelerate>=1.3.0",
    "peft>=0.14.0",
    # train_qlora.py filters kwargs against the installed SFTConfig/SFTTrainer
    # signature, but keep an upper bound so a major TRL rewrite is an explicit
    # opt-in rather than a surprise on the workstation.
    "trl>=0.13.0,<0.24",
    # >=0.45 ships the CUDA 12.4+ / Blackwell (sm_120) kernels the RTX 5090 needs.
    "bitsandbytes>=0.45.0",
    "sentencepiece>=0.2.0",
    "safetensors>=0.4.5",
    "tensorboard>=2.16",
]
# Optional: Unsloth fused kernels (~2x throughput, lower VRAM). Kept separate
# because its pinned deps can conflict; install alongside the `ai` extra:
#   uv pip install -e ".[ai,ai-unsloth]"
ai-unsloth = [
    "unsloth>=2025.1.1",
    "unsloth-zoo>=2025.1.1",
    "xformers>=0.0.29",
]
# Serving the fine-tuned adapter over an OpenAI-compatible local endpoint.
ai-serve = [
    "vllm>=0.7.0",
    "aiohttp>=3.8.0",
    # Constrained decoding for structured_inference.py (tier-1 local grammar
    # enforcement). vLLM also enforces the same schema server-side via
    # guided_json, so this is only needed for the in-process transformers path.
    "outlines>=0.1.0",
    "pydantic>=2.0",
]

# Dev tooling lives in the [dependency-groups] table below (uv-native, and what
# CI installs with `uv sync --all-groups`) — not as a project extra.
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
    "bandit",
    "jsonschema>=4.20",
    # ai_module.structured_inference imports pydantic at module scope, so the
    # AI triage / curation test suites cannot even be collected without it.
    "pydantic>=2.0",
]

[project.scripts]
webscanner = "web_security_scanner.cli:main"

# The project is managed exclusively with `uv` (see README.md / ai_module/README.md).
# Do not use `pip` or `python -m venv` directly.
[tool.uv]
required-version = ">=0.5"
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["web_security_scanner*", "ai_module*"]

[tool.setuptools.package-data]
"web_security_scanner.PAYLOAD" = ["*.json", "data/*.json"]
"web_security_scanner.wordlists" = ["*.json"]
"ai_module.prompts" = ["*.md", "*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["Documentacion", "web_security_scanner/reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
files = ["web_security_scanner", "ai_module"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
