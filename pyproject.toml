[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-security-scanner"
version = "5.2.0"
description = "Advanced Web Security Scanner with AsyncIO and Plugin System"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Luis", email = "luis@example.com"},
]
dependencies = [
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.11.0",
    "colorama>=0.4.0",
    "pyyaml>=6.0",
    "dnspython>=2.3.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
# tools/run_experiments.py (sweep orchestrator; rich is just its optional
# progress bar) and tools/analyze_results.py (the paper's statistics +
# figures over the graded sweep: Friedman/Wilcoxon/McNemar/Nemenyi, effect
# sizes, and the publication plots). scikit-posthocs/matplotlib/seaborn are
# only exercised by the Nemenyi post-hoc and the (skippable via
# --no-figures) plotting step, but are declared here too so this one extra
# fully reproduces `python tools/analyze_results.py`'s output.
experiments = [
    "rich>=13.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-posthocs>=0.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
# Agentic AI subsystem (ai_module/). The LLM triage agent is OFF by default in
# the scanner and is enabled per-run with ``--enable-ai-triaging``. Only the
# lightweight client + structured-decoding layer is needed to *use* a remote
# OpenAI-compatible inference endpoint:
#   uv pip install -e ".[ai]"
ai = [
    "aiohttp>=3.8.0",
    "pydantic>=2.0",
]
# Local constrained decoding / in-process transformers backend (heavy, GPU):
#   uv pip install -e ".[ai,ai-local]"
ai-local = [
    "torch>=2.6.0",
    "transformers>=4.48.0",
    "outlines>=0.1.0",
]
# QLoRA fine-tuning of the local triage/synthesis agent (ai_module/train_qlora.py),
# heavy + GPU-only, not needed to run the scanner or serve the agent:
#   uv pip install -e ".[ai,ai-local,training]"
# TRL >=0.12 moved max_seq_length/packing/dataset_* to SFTConfig and renamed
# tokenizer= to processing_class= (train_qlora.py already targets that API,
# see _build_sft_config / _build_trainer); pin below <0.24 until that surface
# is re-verified against a newer release.
training = [
    "trl>=0.13.0,<0.24",
    "peft>=0.11.0",
    "bitsandbytes>=0.45.0",
    "datasets>=2.19.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
    "bandit",
    "jsonschema>=4.20",
    # ai_module.structured_inference imports pydantic at module scope, so the
    # AI triage / curation test suites cannot even be collected without it.
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
    "bandit",
    "jsonschema>=4.20",
    # ai_module.structured_inference imports pydantic at module scope, so the
    # AI triage / curation test suites cannot even be collected without it.
    "pydantic>=2.0",
]

[project.scripts]
webscanner = "web_security_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["web_security_scanner*", "ai_module*"]

[tool.setuptools.package-data]
"web_security_scanner.PAYLOAD" = ["*.json", "data/*.json"]
"web_security_scanner.wordlists" = ["*.json"]
"ai_module.prompts" = ["*.md", "*.txt"]

[tool.pytest.ini_options]
# `auto` lets plain `async def test_*` run without a per-test
# `@pytest.mark.asyncio`; pinning the fixture loop scope silences the
# pytest-asyncio >=0.21 "unset default loop scope" warning and keeps async
# fixtures on the same loop as the test that uses them.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# ``ai_module``, ``tools`` and ``testbed`` are first-class sources (the AI
# subsystem, the experiment harness and the ground-truth generator), so they are
# linted like the scanner package. Only generated / non-source trees are excluded.
extend-exclude = ["Documentacion", "metrics", "runs", "paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
# The AI subsystem ships in the wheel and is wired into the scan pipeline
# (--enable-ai-triaging), so it is type-checked alongside the scanner rather
# than treated as an unverified script tree. ``tools`` and ``testbed`` are
# first-class sources under ruff (see [tool.ruff] above), so mypy checks them
# too rather than letting them drift as unverified script trees.
files = ["web_security_scanner", "ai_module", "tools", "testbed"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
# Also type-check the bodies of un-annotated functions (catches indexing /
# attribute mistakes the default "skip untyped defs" would let through).
check_untyped_defs = true
