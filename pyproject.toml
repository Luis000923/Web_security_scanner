[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-security-scanner"
version = "5.2.0"
description = "Advanced Web Security Scanner with AsyncIO and Plugin System"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Luis", email = "luis@example.com"},
]
dependencies = [
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.11.0",
    "colorama>=0.4.0",
    "pyyaml>=6.0",
    "dnspython>=2.3.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
# tools/run_experiments.py (sweep orchestrator; rich is just its optional
# progress bar) and tools/analyze_results.py (statistics + figures over the
# graded sweep: Friedman/Wilcoxon/McNemar/Nemenyi, effect sizes, publication
# plots). scikit-posthocs/matplotlib/seaborn are only exercised by the
# Nemenyi post-hoc and the (skippable via --no-figures) plotting step, but
# are declared here too so this one extra fully reproduces
# `python tools/analyze_results.py`'s output.
experiments = [
    "rich>=13.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-posthocs>=0.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
    "bandit",
    "jsonschema>=4.20",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
    "bandit",
    "jsonschema>=4.20",
]

[project.scripts]
webscanner = "web_security_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["web_security_scanner*"]

[tool.setuptools.package-data]
"web_security_scanner.PAYLOAD" = ["*.json", "data/*.json"]
"web_security_scanner.wordlists" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["Documentacion", "web_security_scanner/reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
files = ["web_security_scanner"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
