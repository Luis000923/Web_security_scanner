[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-security-scanner"
version = "5.2.0"
description = "Advanced Web Security Scanner with AsyncIO and Plugin System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Luis", email = "luis@example.com"},
]
dependencies = [
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.11.0",
    "colorama>=0.4.0",
    "pyyaml>=6.0",
    "dnspython>=2.3.0",
    "reportlab>=4.0",
    "langgraph>=0.6.11",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
# Agentic AI subsystem (ai_module/). The LLM triage agent is OFF by default in
# the scanner and is enabled per-run with ``--enable-ai-triaging``. Only the
# lightweight client + structured-decoding layer is needed to *use* a remote
# OpenAI-compatible inference endpoint:
#   uv pip install -e ".[ai]"
ai = [
    "aiohttp>=3.8.0",
    "pydantic>=2.0",
]
# Local constrained decoding / in-process transformers backend (heavy, GPU).
# Includes bitsandbytes so int8/4-bit *inference* (not just training) works
# from this extra alone -- ai_module/inference_client.py's local mode needs
# it without pulling in the rest of `training`:
#   uv pip install -e ".[ai,ai-local]"
ai-local = [
    "torch>=2.6.0",
    "transformers>=4.48.0",
    "accelerate>=0.34.0",
    "outlines>=0.1.0",
    "bitsandbytes>=0.45.0",
    "sentencepiece>=0.2.0",
    "safetensors>=0.4.5",
]
# QLoRA fine-tuning of the local triage/synthesis agent (ai_module/train_qlora.py),
# heavy + GPU-only, not needed to run the scanner or serve the agent:
#   uv pip install -e ".[ai,ai-local,training]"
# TRL >=0.12 moved max_seq_length/packing/dataset_* to SFTConfig and renamed
# tokenizer= to processing_class= (train_qlora.py already targets that API,
# see _build_sft_config / _build_trainer); pin below <0.24 until that surface
# is re-verified against a newer release.
training = [
    "trl>=0.13.0,<0.24",
    "peft>=0.11.0",
    "bitsandbytes>=0.45.0",
    "datasets>=2.19.0",
    "tensorboard>=2.16",
]
# Optional: Unsloth fused kernels (~2x throughput, lower VRAM) for `training`.
# Kept separate because its pinned deps can conflict:
#   uv pip install -e ".[ai,ai-local,training,ai-unsloth]"
ai-unsloth = [
    "unsloth>=2025.1.1",
    "unsloth-zoo>=2025.1.1",
    "xformers>=0.0.29",
]
# Optional: DeepSpeed ZeRO-2/3 CPU/RAM offload, for `train_qlora.py
# --full-finetune` on a small-VRAM card (e.g. a 6 GB RTX 4050) where
# LoRA/QLoRA is not the goal. Separate from `training` because DeepSpeed
# compiles CUDA extensions on install and is Linux-only in practice (no
# supported Windows wheel):
#   uv pip install -e ".[ai,ai-local,training,ai-offload]"
ai-offload = [
    "deepspeed>=0.15.0",
]
# Serving the fine-tuned adapter over an OpenAI-compatible endpoint --
# ai_module/inference_client.py's *web* mode talks to this (or any other
# OpenAI-compatible remote deployment) over plain aiohttp, so installing
# this extra is only needed to *host* that endpoint yourself:
#   uv pip install -e ".[ai-serve]"
ai-serve = [
    "vllm>=0.7.0",
    "aiohttp>=3.8.0",
    # Constrained decoding for structured_inference.py (tier-1 local grammar
    # enforcement). vLLM also enforces the same schema server-side via
    # guided_json, so this is only needed for the in-process transformers path.
    "outlines>=0.1.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
    "bandit",
    # bandit has no native SARIF writer (-f only accepts csv/custom/html/json/
    # screen/txt/xml/yaml); this registers the "sarif" format bandit's CLI
    # picks up via its formatter entry points.
    "bandit-sarif-formatter",
    "jsonschema>=4.20",
    # ai_module.structured_inference imports pydantic at module scope, so the
    # AI triage / curation test suites cannot even be collected without it.
    "pydantic>=2.0",
]

# Dev tooling lives in the [dependency-groups] table below (uv-native, and what
# CI installs with `uv sync --all-groups`) — not as a project extra.
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
    "bandit",
    "bandit-sarif-formatter",
    "jsonschema>=4.20",
    # ai_module.structured_inference imports pydantic at module scope, so the
    # AI triage / curation test suites cannot even be collected without it.
    "pydantic>=2.0",
]

[project.scripts]
webscanner = "web_security_scanner.cli:main"

# The project is managed exclusively with `uv` (see README.md / ai_module/README.md).
# Do not use `pip` or `python -m venv` directly.
[tool.uv]
required-version = ">=0.5"
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["web_security_scanner*", "ai_module*"]

[tool.setuptools.package-data]
"web_security_scanner.PAYLOAD" = ["*.json", "data/*.json"]
"web_security_scanner.wordlists" = ["*.json"]
"ai_module.prompts" = ["*.md", "*.txt"]

[tool.pytest.ini_options]
# `auto` lets plain `async def test_*` run without a per-test
# `@pytest.mark.asyncio`; pinning the fixture loop scope silences the
# pytest-asyncio >=0.21 "unset default loop scope" warning and keeps async
# fixtures on the same loop as the test that uses them.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["Documentacion", "web_security_scanner/reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
# The AI subsystem ships in the wheel and is wired into the scan pipeline
# (--enable-ai-triaging), so it is type-checked alongside the scanner.
files = ["web_security_scanner", "ai_module"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
# Also type-check the bodies of un-annotated functions (catches indexing /
# attribute mistakes the default "skip untyped defs" would let through).
check_untyped_defs = true

# numpy is not imported anywhere in web_security_scanner/ai_module; it is
# pulled in transitively by torch (ai_module's optional QLoRA training path).
# numpy's own bundled __init__.pyi uses PEP 695 `type` statements, which is
# valid stub syntax but only parseable when python_version >= 3.12. We pin
# python_version to 3.10 above (the floor of the CI matrix, so we still catch
# 3.10-incompatible constructs in *our* code) rather than bump it repo-wide
# just to satisfy a stub we never read types from. "skip" tells mypy not to
# parse numpy's stubs at all instead of failing the whole run on them.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_errors = true
