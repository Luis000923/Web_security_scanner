name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type check and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run linter (ruff)
        run: uv run ruff check .

      - name: Run type checker (mypy)
        run: uv run mypy

      - name: Run unit tests (pytest, with coverage)
        run: uv run pytest -q --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  security:
    name: Static security analysis (Bandit + Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # SARIF is uploaded as a workflow artifact (see below), not via
      # github/codeql-action/upload-sarif -- that API needs GitHub Advanced
      # Security, which isn't available on a private repo without a paid
      # add-on. Re-add `security-events: write` + upload-sarif steps if this
      # repo goes public or GHAS gets enabled.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run Bandit (SAST)
        run: uv run bandit -c bandit.yaml -r . -f sarif -o bandit-results.sarif
        continue-on-error: true

      - name: Fail build on Bandit findings
        run: uv run bandit -c bandit.yaml -r .

      - name: Run Semgrep (SAST)
        run: pipx run semgrep --config .semgrep.yml --sarif --output semgrep-results.sarif .
        continue-on-error: true

      - name: Fail build on Semgrep findings
        run: pipx run semgrep --config .semgrep.yml --error .

      - name: Upload SARIF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-sarif-reports
          path: |
            bandit-results.sarif
            semgrep-results.sarif
          retention-days: 14
          if-no-files-found: warn
