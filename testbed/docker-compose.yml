# testbed/docker-compose.yml
#
# Banco de pruebas (Testbed) para la recolección de evidencia empírica del paper.
# Levanta aplicaciones vulnerables estándar de la academia sobre una red
# aislada. El escáner DAST se ejecuta desde el host (no en un contenedor) y
# apunta a los puertos publicados en 127.0.0.1.
#
#   docker compose -f testbed/docker-compose.yml up -d
#   docker compose -f testbed/docker-compose.yml ps
#   docker compose -f testbed/docker-compose.yml down -v
#
# NOTA sobre las imágenes: OWASP no publica un tag "oficial" estable en Docker
# Hub para todos estos proyectos. Se fijan digests/tags concretos y se anota
# la fuente. Si un tag no resuelve en tu entorno, revisa la alternativa
# comentada bajo cada servicio.

name: websec-testbed

networks:
  testbed_network:
    name: testbed_network
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # OWASP Benchmark — https://github.com/OWASP-Benchmark/BenchmarkJava
  # Aplicación Java/Spring con ~2740 casos de prueba y verdad de terreno oficial
  # en src/main/resources/benchmark/expectedresults-1.2.csv
  # ---------------------------------------------------------------------------
  owasp-benchmark:
    image: owasp/benchmark:latest   # OWASP publica solo el tag :latest (Benchmark 1.2)
    # Alternativa reproducible (fija la versión tú mismo):
    #   git clone https://github.com/OWASP-Benchmark/BenchmarkJava
    #   docker build -t owasp/benchmark:1.2 BenchmarkJava   # y cambia el tag arriba
    container_name: owasp-benchmark
    networks: [testbed_network]
    # La imagen trae el .war ya compilado pero su CMD por defecto es /bin/bash.
    # Arrancamos el Tomcat embebido (cargo:run) enlazando en 0.0.0.0:8443.
    working_dir: /owasp/BenchmarkJava
    command: ["sh", "-c", "./runRemoteAccessibleBenchmark.sh -q"]
    ports:
      - "127.0.0.1:8443:8443"   # HTTPS (TLS autofirmado)
    environment:
      - MAVEN_OPTS=-Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:8443/benchmark/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 40
      start_period: 300s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WAVSEP — Web Application Vulnerability Scanner Evaluation Project
  # http://sectooladdict.blogspot.com / https://github.com/sectooladdict/wavsep
  # Imagen pública mantenida por el ICTU (auditoría del gobierno holandés).
  # ---------------------------------------------------------------------------
  wavsep:
    image: zaproxy/wavsep:latest   # mantenida por el proyecto OWASP ZAP
    # Alternativas conocidas:
    #   - w4af/wavsep                 (proyecto w4af / w3af)
    #   - andresriancho/wavsep
    container_name: wavsep
    networks: [testbed_network]
    ports:
      - "127.0.0.1:9080:8080"   # http://127.0.0.1:9080/wavsep/
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/wavsep/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped
