rules:
  - id: insecure-pickle-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      Deserializing data with pickle/cPickle/shelve (load, loads, Unpickler)
      executes arbitrary code embedded in the stream. Never unpickle data
      from an untrusted or network-reachable source; use a safe format
      (json) or sign/verify the payload before loading it.
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      references:
        - https://docs.python.org/3/library/pickle.html#restricting-globals
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)
          - pattern: cPickle.load(...)
          - pattern: cPickle.loads(...)
          - pattern: pickle.Unpickler(...)
          - pattern: shelve.open(...)

  - id: dangerous-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      subprocess call with shell=True interpolates its command through the
      system shell, so any attacker-influenced argument enables shell
      metacharacter/command injection. Pass the command as a list of
      argument strings and drop shell=True instead.
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"
      references:
        - https://docs.python.org/3/library/subprocess.html#security-considerations
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: os.system(...)
          - pattern: os.popen(...)

  - id: yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: >-
      yaml.load() without an explicit safe Loader can construct arbitrary
      Python objects from the input document (equivalent risk to pickle).
      Use yaml.safe_load() instead.
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
    pattern-either:
      - pattern: yaml.load($DATA)
      - pattern: yaml.load($DATA, Loader=yaml.Loader)
      - pattern: yaml.load($DATA, Loader=yaml.UnsafeLoader)
      - pattern: yaml.load($DATA, Loader=yaml.FullLoader)
